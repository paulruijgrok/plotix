[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotix"
version = "0.1.0"
description = "Quick, beautiful, publication-ready plots of experimental data files, with source-data CSVs alongside every figure."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Ruijgrok" }]
keywords = ["plotting", "chromatography", "FPLC", "AKTA", "UNICORN", "matplotlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "vulture",
]

[project.scripts]
plotix = "plotix.cli:main"

[project.urls]
Homepage = "https://github.com/paulruijgrok/plotix"
Repository = "https://github.com/paulruijgrok/plotix"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plotix = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
