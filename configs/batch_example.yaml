# Example plotix batch config.
#
#   plotix batch configs/batch_example.yaml
#
# Command-line flags override anything set here, so a saved config can be
# reused with a one-off change. See docs/batch_processing.md.

# Files or folders to plot. Folders are searched recursively by default.
inputs:
  - Data/FPLC

# Where output goes. Leave `outdir` unset to use the dated session layout —
# output/<YYYYMMDD>_<FORMAT>/<YYYYMMDD_HHMMSS>/ — or set it to write exactly
# somewhere. `daily: true` drops the per-run folder and overwrites the day's.
output_root: output
daily: false
# label: overnight
# outdir: some/exact/place

# Which files to pick up under each input folder. Native .res result files
# and .asc exports are both read; listing both means a folder holding either
# (or both) just works.
patterns:
  - "*.res"
  - "*.asc"
recursive: true

# false (default) mirrors each file's source subfolder in the output, so two
# experiment folders holding a run of the same name stay apart.
flat: false

formats:
  - png
  - pdf
  - svg
dpi: 300

# false skips datasets whose figures already exist, so an interrupted run
# resumes on re-run. Set true to re-plot everything.
force: false

# true gives each input its own subfolder under outdir.
per_file_subdir: false

log: output/batch.log

# Passed straight to the format's plot function — anything the Python API
# accepts can be set here.
plot:
  auxiliary: auto      # auto | none | a list of channel names
  max_peaks: 6
  annotate_peaks_: true
  origin: injection    # .res only: injection | start | a number in ml
  trim: true           # .res only: drop the equilibration before the origin
